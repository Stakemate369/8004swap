[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "8004swap-agent-sdk"
version = "0.1.0"
description = "Cliente Python para agentes se conectarem ao Relay do 8004Swap (handshake WS, RFQ, assinatura EIP-712 e liquidação on-chain)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "eth-account>=0.13",
    "websockets>=13",
    "web3>=7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
