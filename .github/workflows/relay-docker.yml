name: Relay Docker image

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          push: true
          # ghcr.io exige nome do repositório em minúsculo, mas github.repository_owner
          # preserva a caixa exata do usuário (Stakemate369) — por isso fixo em minúsculo aqui
          tags: |
            ghcr.io/stakemate369/8004swap-relay:latest
            ghcr.io/stakemate369/8004swap-relay:${{ github.sha }}
